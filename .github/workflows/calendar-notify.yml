name: Calendar LINE Notification

on:
  schedule:
    - cron: "0,15,30,45 * * * *"   # every 15 minutes, 24/7
  workflow_dispatch:                 # lets you test it manually from GitHub UI

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests icalendar pytz

      - name: Run notifier
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: python notify.py
